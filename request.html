<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#0B0D10">
        <link rel="preload" href="fonts/archivo-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
        <link rel="preload" href="fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
        <link rel="stylesheet" href="css/fonts.css">
        <link rel="stylesheet" href="css/styles.css">
        <title>Request a repair — CircuitCare Repair</title>
    </head>
    <body>
        <a class="skip" href="#main">Skip to content</a>
        <header class="site" id="site-header" data-active="request"></header>
        <main id="main" class="wrap page narrow">
            <div class="page-head">
                <p class="eyebrow">Request a repair</p>
                <h1>Tell us what’s wrong.</h1>
                <p class="muted">
                    Sending as
                    <strong id="who"></strong>
                    . We’ll use your account details to contact you.
                </p>
            </div>
            <form id="f" class="card" novalidate>
                <div class="form-error" role="alert" hidden></div>
                <fieldset class="field">
                    <legend>Device type</legend>
                    <div class="chips">
                        <label class="chip">
                            <input type="radio" name="device" value="Laptop" aria-describedby="device-err">
                            <span>Laptop</span>
                        </label>
                        <label class="chip">
                            <input type="radio" name="device" value="Desktop">
                            <span>Desktop</span>
                        </label>
                        <label class="chip">
                            <input type="radio" name="device" value="Phone">
                            <span>Phone</span>
                        </label>
                        <label class="chip">
                            <input type="radio" name="device" value="Tablet">
                            <span>Tablet</span>
                        </label>
                        <label class="chip">
                            <input type="radio" name="device" value="Other">
                            <span>Other</span>
                        </label>
                    </div>
                    <p class="err" id="device-err"></p>
                </fieldset>
                <div class="field">
                    <label for="model">Brand and model (optional)</label>
                    <input id="model" name="model" autocomplete="off" placeholder="Samsung A54…">
                </div>
                <div class="field">
                    <label for="issue">What’s wrong?</label>
                    <textarea
                        id="issue"
                        name="issue"
                        rows="5"
                        placeholder="The screen is cracked and doesn’t respond to touch…"
                        aria-describedby="issue-err"
                    ></textarea>
                    <p class="err" id="issue-err"></p>
                </div>
                <button class="btn btn-primary btn-block" type="submit">Send repair request</button>
            </form>
            <section id="done" class="card done" aria-labelledby="done-title" hidden>
                <p class="eyebrow">Request sent</p>
                <h2 id="done-title" tabindex="-1">Your ticket number</h2>
                <p class="big-num mono" id="done-no"></p>
                <p class="muted">Keep this number. You can follow your repair from your dashboard at any time.</p>
                <div class="cta-row">
                    <a class="btn btn-primary" id="done-track" href="track.html">Track this repair</a>
                    <a class="btn btn-ghost" href="dashboard.html">Back to my repairs</a>
                </div>
            </section>
        </main>
        <script src="js/config.js"></script>
        <script src="js/app.js"></script>
        <script src="js/pages/request.js"></script>
    </body>
</html>
