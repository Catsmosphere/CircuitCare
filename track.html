<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#0B0D10">
        <link rel="preload" href="fonts/archivo-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
        <link rel="preload" href="fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
        <link rel="stylesheet" href="css/fonts.css">
        <link rel="stylesheet" href="css/styles.css">
        <title>Track a repair — CircuitCare Repair</title>
    </head>
    <body>
        <a class="skip" href="#main">Skip to content</a>
        <header class="site" id="site-header" data-active="track"></header>
        <main id="main" class="wrap page narrow">
            <div class="page-head">
                <p class="eyebrow">Track a repair</p>
                <h1>Where’s my repair?</h1>
            </div>
            <form id="f" novalidate>
                <div class="form-error" role="alert" hidden></div>
                <div class="field">
                    <label for="ticket">Ticket number</label>
                    <div class="lookup">
                        <div class="row">
                            <input
                                id="ticket"
                                name="ticket"
                                inputmode="text"
                                autocapitalize="characters"
                                autocomplete="off"
                                spellcheck="false"
                                placeholder="A3N4K…"
                                aria-describedby="ticket-err">
                            <button class="btn btn-primary" type="submit">Check status</button>
                        </div>
                    </div>
                    <p class="err" id="ticket-err"></p>
                </div>
            </form>
            <div id="out" class="stack" aria-live="polite"></div>
        </main>
        <script src="js/config.js"></script>
        <script src="js/app.js"></script>
        <script src="js/pages/track.js"></script>
    </body>
</html>
