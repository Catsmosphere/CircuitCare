<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#0B0D10">
        <link rel="preload" href="fonts/archivo-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
        <link rel="preload" href="fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
        <link rel="stylesheet" href="css/fonts.css">
        <link rel="stylesheet" href="css/styles.css">
        <title>Repair tickets — CircuitCare Repair</title>
    </head>
    <body>
        <a class="skip" href="#main">Skip to content</a>
        <header class="site" id="site-header" data-active="home"></header>
        <main id="main" class="wrap page">
            <div class="page-head">
                <p class="eyebrow">Owner dashboard</p>
                <h1>Repair tickets</h1>
            </div>
            <div class="stats" id="stats" aria-live="polite"></div>
            <div class="controls">
                <div class="chips" id="filters" role="group" aria-label="Filter by status"></div>
                <div class="field">
                    <label for="q">Search</label>
                    <input
                        id="q"
                        type="search"
                        autocomplete="off"
                        spellcheck="false"
                        placeholder="Ticket or customer name…">
                </div>
            </div>
            <ul class="rows owner" id="list" aria-live="polite"></ul>
            <nav class="pagination" id="pagination" aria-label="Ticket pages" hidden></nav>
        </main>
        <footer class="site">
            <div class="wrap"><span class="mono">&copy; 2026 CircuitCare Repair — All rights reserve.</span></div>
        </footer>
        <script src="js/config.js"></script>
        <script src="js/app.js"></script>
        <script src="js/pages/owner.js"></script>
    </body>
</html>
